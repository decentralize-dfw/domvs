<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo5 — Akıllı Video Player</title>
<style>
  :root{
    --bg:#07090d; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
    --txt:#eaf0f7; --dim:#8b96a6; --acc:#5ee0c8; --acc2:#ff8f6b; --br:#ffd166; --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 20% -10%, #12202b 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #1c1420 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:400 15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100%;
    padding:22px;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{width:min(1200px,100%);display:flex;flex-direction:column;gap:12px}

  .screen{position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;
    background:#000;border:1px solid var(--line);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03) inset;isolation:isolate}
  .screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;pointer-events:none;transform:translateZ(0);backface-visibility:hidden}
  .screen video.on{opacity:1}

  .hud{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.45) 0%,transparent 24%,transparent 60%,rgba(0,0,0,.55) 100%)}
  .top{position:absolute;top:16px;left:76px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .sec-no{font:200 32px/1 ui-sans-serif,system-ui;letter-spacing:-.02em;opacity:.5}
  .sec-name{font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .sec-sub{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.62);margin-top:3px}
  .sec-sub b{color:var(--br);font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
    background:rgba(10,14,20,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .badge.trans i{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
  .badge.fast i{background:var(--br);box-shadow:0 0 10px var(--br);animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.3}to{opacity:1}}

  .clipbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.10)}
  .clipbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff)}
  .clipbar.trans > i{background:linear-gradient(90deg,var(--acc2),var(--br))}

  /* --- dikey ağaç rayı --- */
  .rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:2px;pointer-events:auto}
  .rrow{display:flex;align-items:center;height:26px;gap:0}
  .mdot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.26);cursor:pointer;
    transition:.2s;flex:none;position:relative}
  .mdot:hover{background:rgba(255,255,255,.7);transform:scale(1.2)}
  .rrow.on .mdot{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
  .rrow.past .mdot{background:rgba(255,255,255,.5)}
  .vline{position:absolute;left:5px;top:19px;height:16px;width:1px;background:rgba(255,255,255,.18);z-index:-1}
  .twigs{display:flex;align-items:center;gap:0;overflow:hidden;max-width:0;opacity:0;transition:max-width .3s,opacity .25s}
  .rrow.on .twigs{max-width:150px;opacity:1}
  .tline{width:14px;height:1px;background:rgba(255,255,255,.28);flex:none}
  .bdot{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.22);cursor:pointer;
    transition:.18s;flex:none;transform:rotate(45deg)}
  .bdot:hover{background:var(--br);transform:rotate(45deg) scale(1.25)}
  .bdot.on{background:var(--br);box-shadow:0 0 10px var(--br)}

  .arrows{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .arrows .pair{display:flex;gap:8px}
  .rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:rgba(12,16,22,.55);border:1px solid rgba(255,255,255,.16);color:#fff;
    backdrop-filter:blur(12px);transition:transform .16s,background .16s,opacity .16s}
  .rbtn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
  .rbtn:active{transform:scale(.94)}
  .rbtn[disabled]{opacity:.24;cursor:not-allowed;transform:none}
  .rbtn.br{border-color:rgba(255,209,102,.45);color:var(--br)}
  .rbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .dbg{position:absolute;right:18px;top:70px;font:11px/1.6 ui-monospace,monospace;color:rgba(255,255,255,.8);
    background:rgba(0,0,0,.5);padding:9px 11px;border-radius:9px;display:none;white-space:pre;pointer-events:none}
  .dbg.on{display:block}

  .bar{display:flex;flex-direction:column;gap:9px;padding:11px 13px;border:1px solid var(--line);
    border-radius:14px;background:var(--panel);backdrop-filter:blur(14px)}
  .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .row .sep{flex:1}
  .t{font-size:12px;color:var(--dim);letter-spacing:.05em}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--txt);
    letter-spacing:.03em;transition:.15s;user-select:none;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.13)}
  .chip b{color:var(--acc);font-weight:600}
  .chip .n{opacity:.45;font-variant-numeric:tabular-nums}
  .chip.sec.on{background:rgba(94,224,200,.16);border-color:rgba(94,224,200,.5)}
  .chip.br{border-color:rgba(255,209,102,.24)}
  .chip.br.on{background:rgba(255,209,102,.18);border-color:rgba(255,209,102,.55)}
  .chip.home.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
  kbd{font:600 11px/1 ui-monospace,monospace;padding:4px 6px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim)}

  .loader{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.97);backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;padding:26px;transition:opacity .5s}
  .loader.gone{opacity:0;pointer-events:none}
  .lbox{width:min(560px,100%)}
  .ltitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .lpct{font:200 68px/1.05 ui-sans-serif,system-ui;margin:8px 0 2px;letter-spacing:-.03em}
  .lstate{font-size:13px;color:var(--dim);min-height:20px}
  .ltrack{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin:18px 0 16px}
  .ltrack > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff);transition:width .18s}
  .micro{display:flex;flex-wrap:wrap;gap:4px}
  .mc{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.09);transition:.2s}
  .mc.dl{background:rgba(255,255,255,.34)}
  .mc.ok{background:var(--acc);box-shadow:0 0 8px rgba(94,224,200,.5)}
  .start{margin-top:20px;width:100%;padding:14px;border-radius:12px;cursor:pointer;background:var(--acc);
    color:#04120f;border:0;font:600 14px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
    opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
  .start.show{opacity:1;transform:none;pointer-events:auto}
  .start:hover{filter:brightness(1.08)}
  .err{color:#ff8a8a;font-size:12px;margin-top:10px;white-space:pre-wrap}
  @media (max-width:760px){
    .rbtn{width:40px;height:40px}.lpct{font-size:52px}.mc{width:9px;height:9px}
    .top{left:18px}.sec-no{display:none}
    .rail{left:10px;top:auto;bottom:10px;transform:none}          /* dar ekranda ray alta iner */
    .rrow{height:19px}.mdot{width:9px;height:9px}
    .vline{top:14px;height:12px;left:4px}
    .tline{width:10px}.bdot{width:7px;height:7px}
    .rrow.on .twigs{max-width:90px}
  }
</style>
</head>
<body>

<div class="app">
  <div class="screen" id="screen">
    <div class="hud">
      <div class="top">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="sec-no" id="secNo">01</div>
          <div>
            <div class="sec-name" id="secName">—</div>
            <div class="sec-sub" id="secSub">—</div>
          </div>
        </div>
        <div class="badge" id="badge"><i></i><span id="badgeTxt">LOOP</span></div>
      </div>

      <div class="dbg" id="dbg"></div>
      <div class="rail" id="rail"></div>

      <div class="arrows">
        <div class="pair">
          <button class="rbtn" id="up" title="Önceki bölüm (↑)"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
          <button class="rbtn br" id="out" title="Ana gövdeye dön (←)"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
        </div>
        <div class="pair">
          <button class="rbtn" id="down" title="Sonraki bölüm (↓)"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
          <button class="rbtn br" id="into" title="Eklenti dalına gir (→)"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </div>

      <div class="clipbar" id="clipbar"><i></i></div>
    </div>
  </div>

  <div class="bar">
    <div class="row" id="secChips"></div>
    <div class="row" id="brChips"></div>
    <div class="row">
      <span class="t" id="statLine">—</span>
      <span class="chip" id="rateChip">yakalama hızı <b id="rateVal">×3</b></span>
      <span class="chip" id="dbgChip">teknik bilgi</span>
      <span class="sep"></span>
      <span class="t"><kbd>↑</kbd><kbd>↓</kbd> bölüm · <kbd>→</kbd><kbd>←</kbd> dal · <kbd>1</kbd>–<kbd>7</kbd> · <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> · <kbd>Esc</kbd> ana</span>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="lbox">
    <div class="ltitle">demo5 · ağaç yapılı video player</div>
    <div class="lpct" id="lpct">0%</div>
    <div class="lstate" id="lstate">klipler indiriliyor…</div>
    <div class="ltrack"><i id="lbar"></i></div>
    <div class="micro" id="micro"></div>
    <button class="start" id="startBtn">Başlat</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ==================================================================
     AĞAÇ
       m1 ─f1/r1─ m2 ─f2/r2─ … ─ m7          (7 ana bölüm, dikey aks)
        ├─e{k}1 / x{k}1─ b{k}1
        ├─e{k}2 / x{k}2─ b{k}2               (her bölüme 3 eklenti dalı)
        └─e{k}3 / x{k}3─ b{k}3

     Kare sözleşmesi (generate_videos.py garanti eder):
       geçiş[0]       == kaynak döngünün 0. karesi
       geçiş[son]+1   == hedef döngünün 0. karesi
       ters[son]      == kaynak döngünün 0. karesi
     Bu yüzden geçişler birbirine de zincirlenebilir: uzak bir düğüme
     giderken ara döngüler hiç oynatılmadan geçişler arka arkaya bağlanır.
  ================================================================== */

  const $ = s => document.querySelector(s);
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const CAN_H264 = !!document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"');
  const EXT  = CAN_H264 ? 'mp4' : 'webm';
  const MIME = CAN_H264 ? 'video/mp4' : 'video/webm';
  const POOL_SIZE = 12;                 // dal klipleri için dinamik havuz

  let MAN = null, SEC = [], AXIS = [], CLIPS = [], FPS = 30;
  const url = {};                       // klip → blob url
  const byClip = new Map();             // klip → video elemanı
  const pinnedEls = [], poolEls = [];
  let clock = 0, protectedIds = new Set();

  let cur = { sec:0, branch:null };
  let target = { sec:0, branch:null };
  let activeId = null, running = false, started = false, catchRate = 3;
  const RATES = [2,3,5];

  const screen = $('#screen'), hud = $('.hud');
  const mkVideo = () => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted',''); v.setAttribute('playsinline','');
    screen.insertBefore(v, hud);
    return v;
  };

  /* ---------------- yükleme ---------------- */
  const dl = {}, primed = {};
  let microCells = {};

  function paint(){
    let d = 0, r = 0;
    CLIPS.forEach(id => { d += dl[id] || 0; r += primed[id] ? 1 : 0; });
    const done = CLIPS.filter(id => (dl[id]||0) >= 1).length;
    CLIPS.forEach(id => {
      const c = microCells[id]; if (!c) return;
      c.classList.toggle('dl', (dl[id]||0) > 0 && (dl[id]||0) < 1);
      c.classList.toggle('ok', (dl[id]||0) >= 1);
    });
    const pct = Math.round(((d/CLIPS.length)*0.88 + (r/PRIME_COUNT)*0.12) * 100);
    $('#lpct').textContent = clamp(pct,0,100) + '%';
    $('#lbar').style.width = clamp(pct,0,100) + '%';
    $('#lstate').textContent = `${done}/${CLIPS.length} klip bellekte` +
      (bytes ? ` · ${(bytes/1048576).toFixed(1)} MB` : '');
  }
  let bytes = 0, PRIME_COUNT = 1;

  async function fetchClip(id){
    const res = await fetch(`media/${id}.${EXT}`, { cache:'force-cache' });
    if (!res.ok) throw new Error(`${id}.${EXT} → HTTP ${res.status}`);
    const total = +res.headers.get('content-length') || 0;
    let blob;
    if (!res.body || !total){
      blob = await res.blob(); bytes += blob.size;
    } else {
      const rd = res.body.getReader(); const chunks = []; let got = 0;
      for(;;){
        const { done, value } = await rd.read();
        if (done) break;
        chunks.push(value); got += value.length; bytes += value.length;
        dl[id] = Math.min(got/total, 0.999); paint();
      }
      blob = new Blob(chunks, { type: MIME });
    }
    url[id] = URL.createObjectURL(blob);
    dl[id] = 1; paint();
  }

  async function pooled(items, limit, fn){
    let i = 0;
    await Promise.all(Array.from({length:limit}, async () => {
      while (i < items.length){ const k = i++; await fn(items[k]); }
    }));
  }

  /* ---------------- eleman havuzu ---------------- */
  function primeEl(el, id){
    el.dataset.clip = id;
    el.dataset.used = ++clock;
    el.loop = false; el.playbackRate = 1;
    el.src = url[id];
    return new Promise(resolve => {
      let done = false;
      const fin = () => { if (done) return; done = true; primed[id] = 1; paint(); resolve(el); };
      const prime = () => {
        if (el.requestVideoFrameCallback) el.requestVideoFrameCallback(() => fin());
        el.addEventListener('seeked', () => setTimeout(fin, 15), { once:true });
        try { el.currentTime = 0.0001; } catch(e){ fin(); }
        setTimeout(fin, 3000);
      };
      el.addEventListener('error', () => fin(), { once:true });
      if (el.readyState >= 3) prime();
      else {
        el.addEventListener('canplaythrough', prime, { once:true });
        el.addEventListener('loadeddata', () => { if (!done) setTimeout(prime, 200); }, { once:true });
        setTimeout(() => { if (!done) prime(); }, 8000);
      }
      el.load();
    });
  }

  const pending = new Map();
  function ensure(id){
    const el = byClip.get(id);
    if (el){ el.dataset.used = ++clock; return pending.get(id) || Promise.resolve(el); }
    const victim = pickVictim(id);
    if (!victim) return Promise.reject(new Error('havuz dolu: ' + id));
    if (victim.dataset.clip) byClip.delete(victim.dataset.clip);
    byClip.set(id, victim);
    const p = primeEl(victim, id).then(v => { pending.delete(id); return v; });
    pending.set(id, p);
    return p;
  }
  function pickVictim(want){
    const free = poolEls.filter(e => !e.dataset.clip);
    if (free.length) return free[0];
    const act = elFor(activeId);
    const cands = poolEls.filter(e => e !== act && !protectedIds.has(e.dataset.clip));
    if (cands.length) return cands.sort((a,b) => (+a.dataset.used||0) - (+b.dataset.used||0))[0];
    const any = poolEls.filter(e => e !== act);
    return any.sort((a,b) => (+a.dataset.used||0) - (+b.dataset.used||0))[0] || null;
  }
  const elFor = id => byClip.get(id) || null;

  function neighborhood(st){
    const s = SEC[st.sec], out = [];
    if (st.branch === null){
      s.branches.forEach(b => out.push(b.enter));
      s.branches.forEach(b => out.push(b.loop));
      s.branches.forEach(b => out.push(b.exit));
    } else {
      const b = s.branches[st.branch];
      out.push(b.exit, b.loop);
      s.branches.forEach((o,i) => { if (i !== st.branch) out.push(o.enter, o.loop); });
    }
    return out;
  }
  let prefetchTok = 0;
  async function prefetch(){
    const my = ++prefetchTok;
    const list = neighborhood(cur);
    protectedIds = new Set(list);
    for (const id of list){
      if (my !== prefetchTok) return;
      try { await ensure(id); } catch(e){}
    }
  }

  /* ---------------- açılış ---------------- */
  async function boot(){
    try {
      MAN = await (await fetch('media/manifest.json', { cache:'force-cache' })).json();
    } catch(err){
      $('#lstate').textContent = 'manifest okunamadı';
      $('#err').textContent = err.message + '\n(sayfayı http:// üzerinden açın)';
      return;
    }
    SEC = MAN.sections; AXIS = MAN.axis; CLIPS = MAN.clips; FPS = MAN.fps || 30;
    CLIPS.forEach(id => { dl[id] = 0; primed[id] = 0; });

    const micro = $('#micro');
    CLIPS.forEach(id => {
      const c = document.createElement('div');
      c.className = 'mc'; c.title = id; micro.appendChild(c); microCells[id] = c;
    });
    buildRail(); buildChips(); updateUI();

    const pinnedIds = [...SEC.map(s => s.loop), ...AXIS.map(a => a.fwd), ...AXIS.map(a => a.rev)];
    PRIME_COUNT = pinnedIds.length + 9;
    pinnedIds.forEach(() => pinnedEls.push(mkVideo()));
    for (let i = 0; i < POOL_SIZE; i++) poolEls.push(mkVideo());

    try {
      await pooled(CLIPS, 8, fetchClip);
    } catch(err){
      $('#lstate').textContent = 'indirme başarısız';
      $('#err').textContent = err.message;
      return;
    }
    $('#lstate').textContent = 'klipler çözülüyor…';

    // sabit (aks) klipler kendi elemanlarına, dal klipleri havuza
    await Promise.all(pinnedIds.map((id, i) => {
      byClip.set(id, pinnedEls[i]);
      return primeEl(pinnedEls[i], id);
    }));
    await prefetch();

    $('#lstate').textContent = `${CLIPS.length} klip bellekte · ${(bytes/1048576).toFixed(1)} MB · geçişler kare hassasiyetinde hazır`;
    $('#startBtn').classList.add('show');
    start().catch(()=>{});
  }

  async function start(){
    if (started) return;
    const el = elFor(SEC[0].loop);
    el.loop = true; el.playbackRate = 1;
    try { el.currentTime = 0; } catch(e){}
    show(el);
    await el.play();
    started = true; activeId = SEC[0].loop;
    $('#loader').classList.add('gone');
    setPhase('loop'); updateUI(); tick();
  }
  $('#startBtn').addEventListener('click', () => start().catch(e => {
    $('#err').textContent = 'oynatma engellendi: ' + e.message;
  }));

  /* ---------------- motor ---------------- */
  function show(el){
    [...pinnedEls, ...poolEls].forEach(v => v.classList.toggle('on', v === el));
  }

  let ramp = 0;
  function rampRate(v, from, to, ms){
    cancelAnimationFrame(ramp);
    if (!v) return;
    const t0 = performance.now();
    v.playbackRate = from;
    const step = () => {
      const k = Math.min((performance.now()-t0)/ms, 1);
      v.playbackRate = from + (to-from)*(1 - Math.pow(1-k, 3));
      if (k < 1) ramp = requestAnimationFrame(step);
    };
    ramp = requestAnimationFrame(step);
  }

  function swapTo(id, { rate = 1, loop = false } = {}){
    cancelAnimationFrame(ramp);
    const next = elFor(id);
    if (!next) return false;
    const prevId = activeId, prev = elFor(prevId);
    if (next.currentTime > 0.25) { try { next.currentTime = 0; } catch(e){} }
    next.loop = loop; next.playbackRate = rate;
    next.dataset.used = ++clock;
    show(next);
    activeId = id;
    const pr = next.play(); if (pr && pr.catch) pr.catch(()=>{});
    if (prev && prev !== next){
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (activeId === prevId) return;
        prev.pause(); prev.loop = false; prev.playbackRate = 1;
        try { prev.currentTime = 0.0001; } catch(e){}
      }));
    }
    return true;
  }

  let watcher = null;
  function cancelWatch(){ if (watcher){ watcher(); watcher = null; } }
  function onClipEnd(v, cb){
    cancelWatch();
    let fired = false, raf = 0;
    const fire = () => { if (fired) return; fired = true; cancelWatch(); cb(); };
    const ended = () => fire();
    v.addEventListener('ended', ended);
    const tk = () => {
      const d = v.duration || 0;
      const lead = Math.max(v.playbackRate,1)/60 * 1.15;
      if (d && d - v.currentTime <= lead) return fire();
      raf = requestAnimationFrame(tk);
    };
    raf = requestAnimationFrame(tk);
    watcher = () => { v.removeEventListener('ended', ended); cancelAnimationFrame(raf); };
  }

  const same = (a,b) => a.sec === b.sec && a.branch === b.branch;
  const loopIdOf = st => st.branch === null ? SEC[st.sec].loop : SEC[st.sec].branches[st.branch].loop;

  function nextStep(){
    if (same(cur, target)) return null;
    const s = SEC[cur.sec];
    if (cur.branch !== null)                                  // önce ana gövdeye çık
      return { clip: s.branches[cur.branch].exit, land:{ sec:cur.sec, branch:null }, kind:'out' };
    if (target.sec !== cur.sec){                              // dikey aks adımı
      const d = target.sec > cur.sec ? 1 : -1;
      return { clip: d > 0 ? AXIS[cur.sec].fwd : AXIS[cur.sec-1].rev,
               land:{ sec:cur.sec + d, branch:null }, kind:'axis' };
    }
    return { clip: s.branches[target.branch].enter,           // dala giriş
             land:{ sec:cur.sec, branch:target.branch }, kind:'in' };
  }

  async function runChain(){
    const step = nextStep();
    if (!step){ finish(); return; }
    try {
      await ensure(step.clip);
      await ensure(loopIdOf(step.land));
    } catch(e){}
    const now = nextStep();                                   // bekleme sırasında hedef değişmiş olabilir
    if (!now){ finish(); return; }
    if (now.clip !== step.clip){ runChain(); return; }

    const playTransition = () => {
      const isLast = same(step.land, target);
      if (!swapTo(step.clip, { rate: catchRate })){ finish(); return; }
      if (isLast) rampRate(elFor(step.clip), catchRate, 1, 380);
      setPhase('trans', step.kind);
      updateUI();
      onClipEnd(elFor(step.clip), () => {
        cur = step.land;
        if (same(cur, target)){
          swapTo(loopIdOf(cur), { rate:1, loop:true });
          finish();
          prefetch();
        } else runChain();                                    // ara döngüyü atla
      });
    };

    const curLoopId = loopIdOf(cur);
    if (activeId === curLoopId){
      const el = elFor(curLoopId);
      el.loop = false; el.playbackRate = catchRate;
      setPhase('fast', step.kind);
      updateUI();
      onClipEnd(el, playTransition);
    } else playTransition();
  }

  function finish(){
    running = false; target = { ...cur };
    setPhase('loop'); updateUI();
  }

  // Hedefe giden yoldaki klipleri sirayla verir (ara donguler haric).
  function pathTo(t){
    const out = []; let st = { ...cur };
    for (let guard = 0; !same(st, t) && guard < 40; guard++){
      const s = SEC[st.sec];
      if (st.branch !== null){ out.push(s.branches[st.branch].exit); st = { sec:st.sec, branch:null }; }
      else if (t.sec !== st.sec){
        const d = t.sec > st.sec ? 1 : -1;
        out.push(d > 0 ? AXIS[st.sec].fwd : AXIS[st.sec-1].rev);
        st = { sec:st.sec + d, branch:null };
      } else { out.push(s.branches[t.branch].enter); st = { sec:st.sec, branch:t.branch }; }
    }
    out.push(loopIdOf(t));
    return out;
  }
  async function ensurePath(t){
    const list = pathTo(t);
    protectedIds = new Set([...list, activeId]);
    prefetchTok++;                                  // komsu ön-yüklemesini durdur
    for (const id of list){ try { await ensure(id); } catch(e){} }
  }

  async function request(sec, branch){
    if (!started) return;
    sec = clamp(sec, 0, SEC.length-1);
    if (branch !== null) branch = clamp(branch, 0, SEC[sec].branches.length-1);
    const t = { sec, branch };
    if (same(cur, t) && !running){ bump(); return; }
    target = t; updateUI();
    if (running){ ensurePath(t); return; }          // çalışan zincir yeni hedefi kendi alır
    running = true; updateUI();
    await ensurePath(t);
    if (!running) return;
    runChain();
  }
  function bump(){
    const b = $('#screen');
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
  const here = () => running ? target : cur;

  /* ---------------- arayüz ---------------- */
  function buildRail(){
    const rail = $('#rail'); rail.innerHTML = '';
    SEC.forEach((s,i) => {
      const row = document.createElement('div');
      row.className = 'rrow'; row.dataset.i = i;
      const dot = document.createElement('div');
      dot.className = 'mdot'; dot.title = `${i+1}. bölüm · ${s.name}`;
      dot.addEventListener('click', () => request(i, null));
      row.appendChild(dot);
      const tw = document.createElement('div');
      tw.className = 'twigs';
      s.branches.forEach((b,bi) => {
        const l = document.createElement('div'); l.className = 'tline'; tw.appendChild(l);
        const d = document.createElement('div');
        d.className = 'bdot'; d.dataset.b = bi; d.title = `+ ${b.name}`;
        d.addEventListener('click', () => request(i, bi));
        tw.appendChild(d);
      });
      row.appendChild(tw);
      if (i < SEC.length-1){
        const v = document.createElement('div');
        v.className = 'vline';
        row.appendChild(v);
      }
      rail.appendChild(row);
    });
  }
  function buildChips(){
    const sc = $('#secChips'); sc.innerHTML = '';
    SEC.forEach((s,i) => {
      const el = document.createElement('span');
      el.className = 'chip sec'; el.dataset.i = i;
      el.innerHTML = `<span class="n">0${i+1}</span> ${s.name}`;
      el.addEventListener('click', () => request(i, null));
      sc.appendChild(el);
    });
    const bc = $('#brChips'); bc.innerHTML = '';
    const home = document.createElement('span');
    home.className = 'chip home'; home.id = 'homeChip'; home.textContent = 'ANA GÖVDE';
    home.addEventListener('click', () => request(here().sec, null));
    bc.appendChild(home);
    for (let bi = 0; bi < 3; bi++){
      const el = document.createElement('span');
      el.className = 'chip br'; el.dataset.b = bi;
      el.addEventListener('click', () => request(here().sec, bi));
      bc.appendChild(el);
    }
  }

  function updateUI(){
    const h = here(), s = SEC[cur.sec];
    screen.dataset.busy = running ? '1' : '0';
    document.querySelectorAll('.rrow').forEach(r => {
      const i = +r.dataset.i;
      r.classList.toggle('on', i === cur.sec);
      r.classList.toggle('past', i < cur.sec);
      r.querySelectorAll('.bdot').forEach(d =>
        d.classList.toggle('on', i === cur.sec && cur.branch === +d.dataset.b));
    });
    document.querySelectorAll('.chip.sec').forEach(c => c.classList.toggle('on', +c.dataset.i === cur.sec));
    document.querySelectorAll('.chip.br').forEach(c => {
      const bi = +c.dataset.b, b = s.branches[bi];
      c.innerHTML = `<span class="n">+</span> ${b.name}`;
      c.classList.toggle('on', cur.branch === bi);
    });
    $('#homeChip').classList.toggle('on', cur.branch === null);
    $('#up').disabled   = cur.sec === 0 && cur.branch === null && !running;
    $('#down').disabled = cur.sec === SEC.length-1 && cur.branch === null && !running;
    $('#out').disabled  = cur.branch === null && !running;
    $('#into').disabled = false;
    $('#statLine').textContent =
      `${SEC.length} bölüm × 3 eklenti · ${CLIPS.length} klip` +
      (bytes ? ` · ${(bytes/1048576).toFixed(1)} MB bellekte` : '');
  }

  function setPhase(mode, kind){
    const b = $('#badge'), t = $('#badgeTxt'), s = SEC[cur.sec];
    b.className = 'badge' + (mode === 'loop' ? '' : ' ' + mode);
    const dist = Math.abs(target.sec - cur.sec) + (target.branch !== cur.branch ? 1 : 0);
    t.textContent = mode === 'loop' ? (cur.branch === null ? 'ANA DÖNGÜ' : 'EKLENTİ DÖNGÜSÜ')
      : mode === 'fast' ? '×' + catchRate + ' SON KAREYE YETİŞİYOR'
      : kind === 'in'  ? 'DALA GİRİŞ'
      : kind === 'out' ? 'ANA GÖVDEYE DÖNÜŞ'
      : (dist > 1 ? `GEÇİŞ ZİNCİRİ · ${dist} ADIM` : 'AKS GEÇİŞİ');
    $('#clipbar').classList.toggle('trans', mode !== 'loop');
    $('#secNo').textContent = String(cur.sec+1).padStart(2,'0');
    $('#secName').textContent = `BÖLÜM ${String(cur.sec+1).padStart(2,'0')} · ${s.name}`;
    $('#secSub').innerHTML = cur.branch === null
      ? s.sub + ' · ana gövde'
      : `${s.sub} · <b>+ ${s.branches[cur.branch].name}</b> eklentisi`;
  }

  function tick(){
    const v = elFor(activeId);
    if (v && v.duration){
      $('#clipbar').firstElementChild.style.width = (v.currentTime/v.duration*100) + '%';
      if ($('#dbg').classList.contains('on')){
        $('#dbg').textContent =
          `klip    : ${activeId}\n` +
          `kare    : ${Math.floor(v.currentTime*FPS)} / ${Math.round(v.duration*FPS)}\n` +
          `hız     : ×${v.playbackRate.toFixed(2)}\n` +
          `loop    : ${v.loop}\n` +
          `konum   : ${cur.sec+1}${cur.branch===null?' (ana)':'.'+(cur.branch+1)}` +
          ` → ${target.sec+1}${target.branch===null?' (ana)':'.'+(target.branch+1)}` +
          `${running?' [zincir]':''}\n` +
          `eleman  : ${pinnedEls.length} sabit + ${poolEls.filter(e=>e.dataset.clip).length}/${POOL_SIZE} havuz\n` +
          `tampon  : ${v.buffered.length ? Math.round(v.buffered.end(v.buffered.length-1)/v.duration*100) : 0}%`;
      }
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- girdi ---------------- */
  const goAxis = d => { const h = here(); request(h.sec + d, null); };
  const goIn   = () => { const h = here(); request(h.sec, h.branch === null ? 0 : Math.min(h.branch+1, 2)); };
  const goOut  = () => { const h = here(); request(h.sec, h.branch === null || h.branch === 0 ? null : h.branch-1); };

  $('#up').addEventListener('click',   () => goAxis(-1));
  $('#down').addEventListener('click', () => goAxis(1));
  $('#into').addEventListener('click', goIn);
  $('#out').addEventListener('click',  goOut);
  $('#dbgChip').addEventListener('click', () => $('#dbg').classList.toggle('on'));
  $('#rateChip').addEventListener('click', () => {
    catchRate = RATES[(RATES.indexOf(catchRate)+1) % RATES.length];
    $('#rateVal').textContent = '×' + catchRate;
  });

  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp'){ e.preventDefault(); goAxis(-1); }
    else if (k === 'ArrowDown'){ e.preventDefault(); goAxis(1); }
    else if (k === 'ArrowRight'){ e.preventDefault(); goIn(); }
    else if (k === 'ArrowLeft'){ e.preventDefault(); goOut(); }
    else if (k === 'Escape' || k === '0'){ request(here().sec, null); }
    else if (k === 'Home'){ request(0, null); }
    else if (k === 'End'){ request(SEC.length-1, null); }
    else if (k >= '1' && k <= String(Math.min(9, SEC.length))) request(+k-1, here().branch);
    else if ('qwe'.includes(k.toLowerCase()) && k.length === 1) request(here().sec, 'qwe'.indexOf(k.toLowerCase()));
    else if (k.toLowerCase() === 'd') $('#dbg').classList.toggle('on');
  });

  boot();
})();
</script>
</body>
</html>
