<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo5 — Akıllı Video Player</title>
<style>
  :root{
    --bg:#07090d; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
    --txt:#eaf0f7; --dim:#8b96a6; --acc:#5ee0c8; --acc2:#ff8f6b; --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 20% -10%, #12202b 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #1c1420 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:400 15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100%;
    padding:24px;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{width:min(1180px,100%);display:flex;flex-direction:column;gap:14px}

  /* ---------------- ekran ---------------- */
  .screen{
    position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;
    background:#000;border:1px solid var(--line);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03) inset;
    isolation:isolate;
  }
  .screen video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;pointer-events:none;transform:translateZ(0);backface-visibility:hidden;
  }
  .screen video.on{opacity:1}

  .hud{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,transparent 22%,transparent 60%,rgba(0,0,0,.58) 100%)}
  .top{position:absolute;top:16px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .scene-no{font:200 34px/1 ui-sans-serif,system-ui;letter-spacing:-.02em;opacity:.55}
  .scene-name{font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .scene-sub{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-top:3px}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
    background:rgba(10,14,20,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .badge.trans i{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
  .badge.fast i{background:#ffd166;box-shadow:0 0 10px #ffd166;animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.3}to{opacity:1}}

  .clipbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.10)}
  .clipbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff)}
  .clipbar.trans > i{background:linear-gradient(90deg,var(--acc2),#ffd166)}

  /* zincir gostergesi */
  .chain{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:0;pointer-events:auto}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.24);cursor:pointer;
    border:2px solid transparent;transition:.22s;flex:none}
  .dot:hover{background:rgba(255,255,255,.6);transform:scale(1.18)}
  .dot.on{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.16)}
  .dot.done{background:rgba(255,255,255,.5)}
  .link{width:26px;height:2px;background:rgba(255,255,255,.16);transition:.22s;flex:none}
  .link.on{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
  .link.done{background:rgba(255,255,255,.34)}

  .arrows{position:absolute;right:16px;bottom:16px;display:flex;gap:10px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:rgba(12,16,22,.55);border:1px solid rgba(255,255,255,.16);color:#fff;
    backdrop-filter:blur(12px);transition:transform .16s,background .16s,opacity .16s}
  .rbtn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
  .rbtn:active{transform:scale(.94)}
  .rbtn[disabled]{opacity:.26;cursor:not-allowed;transform:none}
  .rbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .dbg{position:absolute;left:18px;top:78px;font:11px/1.6 ui-monospace,monospace;color:rgba(255,255,255,.8);
    background:rgba(0,0,0,.5);padding:9px 11px;border-radius:9px;display:none;white-space:pre}
  .dbg.on{display:block}

  /* ---------------- alt panel ---------------- */
  .bar{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);
    border-radius:14px;background:var(--panel);backdrop-filter:blur(14px)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .sep{flex:1}
  .t{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--txt);
    letter-spacing:.04em;transition:.15s;user-select:none;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.13)}
  .chip b{color:var(--acc);font-weight:600}
  .chip.sc.on{background:rgba(94,224,200,.16);border-color:rgba(94,224,200,.5);color:#fff}
  .chip.sc .n{opacity:.5;font-variant-numeric:tabular-nums}
  kbd{font:600 11px/1 ui-monospace,monospace;padding:4px 6px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim)}

  /* ---------------- yukleme ---------------- */
  .loader{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.97);backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;padding:26px;transition:opacity .5s}
  .loader.gone{opacity:0;pointer-events:none}
  .lbox{width:min(560px,100%)}
  .ltitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .lpct{font:200 68px/1.05 ui-sans-serif,system-ui;margin:8px 0 2px;letter-spacing:-.03em}
  .lstate{font-size:13px;color:var(--dim);min-height:20px}
  .ltrack{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin:18px 0 16px}
  .ltrack > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff);transition:width .18s}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .cell{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.03)}
  .cell .nm{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.04em;color:var(--dim);display:flex;justify-content:space-between}
  .cell .tr{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
  .cell .tr > i{display:block;height:100%;width:0;background:rgba(255,255,255,.45);transition:width .15s}
  .cell.ok{border-color:rgba(94,224,200,.45);background:rgba(94,224,200,.08)}
  .cell.ok .nm{color:var(--acc)}
  .cell.ok .tr > i{background:var(--acc)}
  .start{margin-top:20px;width:100%;padding:14px;border-radius:12px;cursor:pointer;background:var(--acc);
    color:#04120f;border:0;font:600 14px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
    opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
  .start.show{opacity:1;transform:none;pointer-events:auto}
  .start:hover{filter:brightness(1.08)}
  .err{color:#ff8a8a;font-size:12px;margin-top:10px;white-space:pre-wrap}
  @media (max-width:700px){.rbtn{width:44px;height:44px}.lpct{font-size:52px}.grid{grid-template-columns:repeat(2,1fr)}
    .link{width:14px}.scene-no{display:none}}
</style>
</head>
<body>

<div class="app">
  <div class="screen" id="screen">
    <div class="hud">
      <div class="top">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="scene-no" id="sceneNo">01</div>
          <div>
            <div class="scene-name" id="sceneName">—</div>
            <div class="scene-sub" id="sceneSub">—</div>
          </div>
        </div>
        <div class="badge" id="badge"><i></i><span id="badgeTxt">LOOP</span></div>
      </div>

      <div class="dbg" id="dbg"></div>
      <div class="chain" id="chain"></div>

      <div class="arrows">
        <button class="rbtn" id="prev" title="Geri (←)"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
        <button class="rbtn" id="next" title="İleri (→)"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>

      <div class="clipbar" id="clipbar"><i></i></div>
    </div>
  </div>

  <div class="bar">
    <div class="row" id="sceneChips"></div>
    <div class="row">
      <span class="t">Akıllı geçiş motoru · 6 sahne / 16 klip</span>
      <span class="chip" id="rateChip">yakalama hızı <b id="rateVal">×3</b></span>
      <span class="chip" id="dbgChip">teknik bilgi</span>
      <span class="sep"></span>
      <span class="t"><kbd>←</kbd> <kbd>→</kbd> gezin · <kbd>1</kbd>–<kbd>6</kbd> sahneye atla · <kbd>D</kbd> teknik bilgi</span>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="lbox">
    <div class="ltitle">demo5 · akıllı video player</div>
    <div class="lpct" id="lpct">0%</div>
    <div class="lstate" id="lstate">klipler indiriliyor…</div>
    <div class="ltrack"><i id="lbar"></i></div>
    <div class="grid" id="grid"></div>
    <button class="start" id="startBtn">Başlat</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const FPS = 30;

  /* ------------------------------------------------------------------
     Zincir:  L1 =fwd1=> L2 =fwd2=> L3 =fwd3=> L4 =fwd4=> L5 =fwd5=> L6
                 <=rev1=     <=rev2=     <=rev3=     <=rev4=     <=rev5=

     Kare sözleşmesi (generate_videos.py garanti eder):
       fwd_k[0]          == loop_k[0]
       fwd_k[son] + 1    == loop_{k+1}[0]   →  fwd_k[son] → fwd_{k+1}[0] de sürekli
       rev_k[son]        == loop_k[0]
     Bu yüzden zincirleme atlamada ara döngüyü hiç oynatmadan doğrudan
     bir sonraki geçiş klibine girebiliyoruz; görüntü yine kesintisiz.
  ------------------------------------------------------------------ */
  const SCENES = [
    { id:'loop1', name:'OKYANUS',    sub:'derin mavi döngü' },
    { id:'loop2', name:'GÜN BATIMI', sub:'magenta / amber döngü' },
    { id:'loop3', name:'YEŞİM',      sub:'yeşil / altın döngü' },
    { id:'loop4', name:'NEBULA',     sub:'mor / indigo döngü' },
    { id:'loop5', name:'BAKIR',      sub:'çöl tonları döngü' },
    { id:'loop6', name:'BUZUL',      sub:'buz mavisi döngü' }
  ];
  const N   = SCENES.length;
  const FWD = Array.from({length:N-1}, (_,i) => `fwd${i+1}`);
  const REV = Array.from({length:N-1}, (_,i) => `rev${i+1}`);
  const IDS = [...SCENES.map(s => s.id), ...FWD, ...REV];

  // codec seçimi: H.264/mp4 evrensel, VP9/webm yedek
  const CAN_H264 = !!document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"');
  const EXT  = CAN_H264 ? 'mp4' : 'webm';
  const MIME = CAN_H264 ? 'video/mp4' : 'video/webm';

  const $ = s => document.querySelector(s);
  const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

  /* ---------------- video elemanları ---------------- */
  const els = {};
  const screen = $('#screen'), hud = $('.hud');
  IDS.forEach(id => {
    const v = document.createElement('video');
    v.id = id; v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted',''); v.setAttribute('playsinline','');
    screen.insertBefore(v, hud);
    els[id] = v;
  });

  /* ---------------- durum ---------------- */
  let cur = 0;            // ekrandaki sahne
  let target = 0;         // gidilmek istenen sahne
  let activeId = null;    // ekrandaki klip
  let running = false;    // zincir çalışıyor mu
  let started = false;
  let catchRate = 3;
  const RATES = [2,3,5];

  /* ---------------- yükleme ---------------- */
  const grid = $('#grid'), cells = {};
  IDS.forEach(id => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `<div class="nm"><span>${id}</span><span class="p">0%</span></div><div class="tr"><i></i></div>`;
    grid.appendChild(c);
    cells[id] = { c, bar:c.querySelector('i'), p:c.querySelector('.p') };
  });

  const dl = {}, ready = {};
  IDS.forEach(id => { dl[id] = 0; ready[id] = 0; });

  function paint(){
    let d = 0, r = 0;
    IDS.forEach(id => {
      d += dl[id]; r += ready[id];
      const pc = Math.round(dl[id]*100);
      cells[id].bar.style.width = pc + '%';
      cells[id].p.textContent = ready[id] ? 'hazır' : pc + '%';
      cells[id].c.classList.toggle('ok', ready[id] === 1);
    });
    const pct = Math.round(((d/IDS.length)*0.82 + (r/IDS.length)*0.18) * 100);
    $('#lpct').textContent = pct + '%';
    $('#lbar').style.width = pct + '%';
    $('#lstate').textContent = r < IDS.length
      ? `${Math.round(r)}/${IDS.length} klip hazır · tamamı belleğe alınıyor`
      : 'tüm klipler bellekte';
  }

  async function download(id){
    const res = await fetch(`media/${id}.${EXT}`, { cache:'force-cache' });
    if (!res.ok) throw new Error(`${id}.${EXT} → HTTP ${res.status}`);
    const total = +res.headers.get('content-length') || 0;
    if (!res.body || !total){
      const b = await res.blob(); dl[id] = 1; paint(); return b;
    }
    const reader = res.body.getReader(); const chunks = []; let got = 0;
    for(;;){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      dl[id] = Math.min(got/total, 1); paint();
    }
    dl[id] = 1; paint();
    return new Blob(chunks, { type: MIME });
  }

  // "gerçekten hazır" = tüm bayt bellekte + metadata çözüldü + 0. kare boyandı
  function attach(id, blob){
    const v = els[id];
    v.src = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      let settled = false;
      const done = () => { if (settled) return; settled = true; ready[id] = 1; paint(); resolve(); };
      const primeFrame = () => {
        if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => done());
        v.addEventListener('seeked', () => setTimeout(done, 20), { once:true });
        try { v.currentTime = 0.0001; } catch(e){ done(); }
        setTimeout(done, 4000);
      };
      v.addEventListener('error', () => {
        if (settled) return; settled = true;
        reject(new Error(`${id}.${EXT} çözülemedi (kod ${v.error ? v.error.code : '?'})`));
      }, { once:true });
      if (v.readyState >= 4) primeFrame();
      else {
        v.addEventListener('canplaythrough', primeFrame, { once:true });
        v.addEventListener('loadeddata', () => { if (!settled) setTimeout(primeFrame, 400); }, { once:true });
        setTimeout(() => { if (!settled) primeFrame(); }, 20000);   // asla sonsuza kilitlenme
      }
      v.load();
    });
  }

  async function boot(){
    buildChain(); buildChips(); syncUI();
    try{
      await Promise.all(IDS.map(async id => attach(id, await download(id))));
    }catch(err){
      $('#lstate').textContent = 'yükleme başarısız';
      $('#err').textContent = err.message + '\n(sayfayı http:// üzerinden açtığınızdan emin olun)';
      return;
    }
    const notBuffered = IDS.filter(id => {
      const v = els[id];
      return !(v.duration > 0 && v.buffered.length && v.buffered.end(v.buffered.length-1) >= v.duration - 0.05);
    });
    $('#lstate').textContent = notBuffered.length
      ? `${IDS.length - notBuffered.length}/${IDS.length} klip tamponda`
      : `${IDS.length} klip bellekte · geçişler kare hassasiyetinde hazır`;
    $('#startBtn').classList.add('show');
    start().catch(()=>{});                 // sessiz video: otomatik başlar; olmazsa buton
  }

  async function start(){
    if (started) return;
    const v = els[SCENES[0].id];
    v.loop = true; v.playbackRate = 1;
    try { v.currentTime = 0; } catch(e){}
    show(v);
    await v.play();
    started = true; activeId = SCENES[0].id;
    $('#loader').classList.add('gone');
    setBadge('loop'); updateChain(); syncUI(); tick();
  }
  $('#startBtn').addEventListener('click', () => start().catch(e => {
    $('#err').textContent = 'oynatma engellendi: ' + e.message;
  }));

  /* ---------------- motor ---------------- */
  function show(el){ IDS.forEach(id => els[id].classList.toggle('on', els[id] === el)); }

  let ramp = 0;
  function rampRate(v, from, to, ms){
    cancelAnimationFrame(ramp);
    const t0 = performance.now();
    v.playbackRate = from;
    const step = () => {
      const k = Math.min((performance.now() - t0)/ms, 1);
      v.playbackRate = from + (to - from) * (1 - Math.pow(1-k, 3));
      if (k < 1) ramp = requestAnimationFrame(step);
    };
    ramp = requestAnimationFrame(step);
  }

  // Sonraki klip 0. karesinde duraklatılmış ve boyanmış beklediği için
  // katman değişimi tek karede olur → siyah kare / donma yok.
  function swapTo(id, { rate = 1, loop = false } = {}){
    cancelAnimationFrame(ramp);
    const prevId = activeId, next = els[id];
    if (next.currentTime > 0.25) { try { next.currentTime = 0; } catch(e){} }  // güvenlik
    next.loop = loop;
    next.playbackRate = rate;
    show(next);
    activeId = id;
    const p = next.play();
    if (p && p.catch) p.catch(()=>{});
    if (prevId && prevId !== id){
      const prev = els[prevId];
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (activeId === prevId) return;
        prev.pause(); prev.loop = false; prev.playbackRate = 1;
        try { prev.currentTime = 0.0001; } catch(e){}
      }));
    }
  }

  // Klibin son karesine ~1 ekran karesi kala haber verir (donma olmadan devir teslim).
  let watcher = null;
  function cancelWatch(){ if (watcher){ watcher(); watcher = null; } }
  function onClipEnd(v, cb){
    cancelWatch();
    let fired = false, raf = 0;
    const fire = () => { if (fired) return; fired = true; cancelWatch(); cb(); };
    const ended = () => fire();
    v.addEventListener('ended', ended);
    const loopTick = () => {
      const d = v.duration || 0;
      const lead = Math.max(v.playbackRate, 1)/60 * 1.15;
      if (d && d - v.currentTime <= lead) return fire();
      raf = requestAnimationFrame(loopTick);
    };
    raf = requestAnimationFrame(loopTick);
    watcher = () => { v.removeEventListener('ended', ended); cancelAnimationFrame(raf); };
  }

  function requestScene(i){
    if (!started) return;
    i = clamp(i, 0, N-1);
    if (i === target && i === cur && !running){ bump(i > cur ? 1 : -1); return; }
    if (i === cur && !running){ bump(0); return; }
    target = i;
    updateChain(); syncUI();
    if (!running){ running = true; runChain(); }
  }
  function bump(dir){
    const b = dir < 0 ? $('#prev') : $('#next');
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }

  function runChain(){
    if (cur === target){ finish(); return; }
    const dir = target > cur ? 1 : -1;
    const transId = dir > 0 ? FWD[cur] : REV[cur-1];

    const playTransition = () => {
      const isLast = (cur + dir === target);
      swapTo(transId, { rate: catchRate, loop:false });
      if (isLast) rampRate(els[transId], catchRate, 1, 420);   // son geçişte 1×'e yumuşak iniş
      setBadge('trans', dir);
      updateChain(dir);
      onClipEnd(els[transId], () => {
        cur += dir;
        if (cur === target){
          swapTo(SCENES[cur].id, { rate:1, loop:true });
          finish();
        } else {
          runChain();          // ara döngüyü atla, doğrudan sonraki geçişe gir
        }
      });
    };

    if (activeId === SCENES[cur].id){
      // döngüdeyiz: kalan süreyi hızlandırıp son kareye yetiş
      const lp = els[activeId];
      lp.loop = false;
      lp.playbackRate = catchRate;
      setBadge('fast', dir);
      updateChain(dir);
      onClipEnd(lp, playTransition);
    } else {
      playTransition();        // zincir sürüyor: doğrudan geçişe
    }
  }

  function finish(){
    running = false; target = cur;
    setBadge('loop'); updateChain(); syncUI();
  }

  /* ---------------- arayüz ---------------- */
  function buildChain(){
    const c = $('#chain'); c.innerHTML = '';
    for (let i = 0; i < N; i++){
      const d = document.createElement('div');
      d.className = 'dot'; d.dataset.i = i; d.title = `${i+1}. sahne: ${SCENES[i].name}`;
      d.addEventListener('click', () => requestScene(i));
      c.appendChild(d);
      if (i < N-1){
        const l = document.createElement('div');
        l.className = 'link'; l.dataset.l = i; c.appendChild(l);
      }
    }
  }
  function buildChips(){
    const box = $('#sceneChips'); box.innerHTML = '';
    SCENES.forEach((s,i) => {
      const el = document.createElement('span');
      el.className = 'chip sc'; el.dataset.i = i;
      el.innerHTML = `<span class="n">0${i+1}</span> ${s.name}`;
      el.addEventListener('click', () => requestScene(i));
      box.appendChild(el);
    });
  }
  function updateChain(dir){
    document.querySelectorAll('.dot').forEach(d => {
      const i = +d.dataset.i;
      d.classList.toggle('on', i === cur && !dir);
      d.classList.toggle('done', i === cur && !!dir);
    });
    document.querySelectorAll('.link').forEach(l => {
      const i = +l.dataset.l;
      const live = dir ? (dir > 0 ? i === cur : i === cur-1) : false;
      l.classList.toggle('on', live);
      l.classList.toggle('done', !live && ((i < cur) || (running && i < target)));
    });
    document.querySelectorAll('.chip.sc').forEach(c => c.classList.toggle('on', +c.dataset.i === cur));
  }
  function setBadge(mode, dir){
    const b = $('#badge'), t = $('#badgeTxt'), s = SCENES[cur];
    b.className = 'badge' + (mode === 'loop' ? '' : ' ' + mode);
    const steps = Math.abs(target - cur);
    t.textContent = mode === 'loop' ? 'LOOP'
      : mode === 'fast' ? '×' + catchRate + ' SON KAREYE YETİŞİYOR'
      : (steps > 1 ? `GEÇİŞ ZİNCİRİ · ${steps} ADIM` : 'GEÇİŞ KLİBİ');
    $('#clipbar').classList.toggle('trans', mode !== 'loop');
    $('#sceneNo').textContent = String(cur+1).padStart(2,'0');
    $('#sceneName').textContent = `SAHNE ${String(cur+1).padStart(2,'0')} · ${s.name}`;
    $('#sceneSub').textContent = mode === 'loop' ? s.sub
      : mode === 'fast' ? `kalan süre ×${catchRate} hızda tamamlanıyor`
      : (dir > 0 ? `${SCENES[cur].name} → ${SCENES[clamp(cur+1,0,N-1)].name} ara klibi`
                 : `${SCENES[cur].name} → ${SCENES[clamp(cur-1,0,N-1)].name} ara klibi`);
  }
  function syncUI(){
    $('#prev').disabled = cur === 0 && target === 0;
    $('#next').disabled = cur === N-1 && target === N-1;
  }

  function tick(){
    const v = els[activeId];
    if (v && v.duration){
      $('#clipbar').firstElementChild.style.width = (v.currentTime/v.duration*100) + '%';
      if ($('#dbg').classList.contains('on')){
        $('#dbg').textContent =
          `klip    : ${activeId}\n` +
          `kare    : ${Math.floor(v.currentTime*FPS)} / ${Math.round(v.duration*FPS)}\n` +
          `hız     : ×${v.playbackRate.toFixed(2)}\n` +
          `loop    : ${v.loop}\n` +
          `sahne   : ${cur+1} → ${target+1}${running ? ' (zincir)' : ''}\n` +
          `tampon  : ${v.buffered.length ? Math.round(v.buffered.end(v.buffered.length-1)/v.duration*100) : 0}%`;
      }
    }
    requestAnimationFrame(tick);
  }

  $('#next').addEventListener('click', () => requestScene((running ? target : cur) + 1));
  $('#prev').addEventListener('click', () => requestScene((running ? target : cur) - 1));
  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowRight'){ e.preventDefault(); requestScene((running ? target : cur) + 1); }
    else if (k === 'ArrowLeft'){ e.preventDefault(); requestScene((running ? target : cur) - 1); }
    else if (k === 'Home'){ e.preventDefault(); requestScene(0); }
    else if (k === 'End'){ e.preventDefault(); requestScene(N-1); }
    else if (k >= '1' && k <= String(N)) requestScene(+k - 1);
    else if (k.toLowerCase() === 'd') $('#dbg').classList.toggle('on');
  });
  $('#dbgChip').addEventListener('click', () => $('#dbg').classList.toggle('on'));
  $('#rateChip').addEventListener('click', () => {
    catchRate = RATES[(RATES.indexOf(catchRate)+1) % RATES.length];
    $('#rateVal').textContent = '×' + catchRate;
  });

  boot();
})();
</script>
</body>
</html>
