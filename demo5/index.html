<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo5 — Akıllı Video Player</title>
<style>
  :root{
    --bg:#07090d;
    --panel:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.10);
    --txt:#eaf0f7;
    --dim:#8b96a6;
    --acc:#5ee0c8;
    --acc2:#ff8f6b;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 20% -10%, #12202b 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #1c1420 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:400 15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:26px;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:min(1180px,100%);display:flex;flex-direction:column;gap:16px}

  /* ---------- ekran ---------- */
  .screen{
    position:relative;aspect-ratio:16/9;width:100%;
    border-radius:var(--r);overflow:hidden;background:#000;
    border:1px solid var(--line);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03) inset;
    isolation:isolate;
  }
  .screen video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;opacity:0;pointer-events:none;
    transform:translateZ(0);backface-visibility:hidden;
  }
  .screen video.on{opacity:1}

  /* ---------- hud ---------- */
  .hud{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,transparent 24%,transparent 62%,rgba(0,0,0,.55) 100%)}
  .hud .top{position:absolute;top:16px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .scene-name{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .scene-sub{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.62);margin-top:4px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 11px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:rgba(10,14,20,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);
    white-space:nowrap;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .badge.trans i{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
  .badge.fast i{background:#ffd166;box-shadow:0 0 10px #ffd166;animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.35}to{opacity:1}}

  .clipbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.10)}
  .clipbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff)}
  .clipbar.trans > i{background:linear-gradient(90deg,var(--acc2),#ffd166)}

  .chain{position:absolute;left:18px;bottom:20px;display:flex;align-items:center;gap:8px}
  .node{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);transition:background .25s,width .25s}
  .node.on{width:44px;background:#fff}
  .node.trans{width:14px;background:rgba(255,255,255,.14)}
  .node.trans.on{background:var(--acc2);width:22px}

  .arrows{position:absolute;right:16px;bottom:16px;display:flex;gap:10px;pointer-events:auto}
  .rbtn{
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:rgba(12,16,22,.55);border:1px solid rgba(255,255,255,.16);color:#fff;
    backdrop-filter:blur(12px);transition:transform .16s,background .16s,opacity .16s;
  }
  .rbtn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
  .rbtn:active{transform:scale(.94)}
  .rbtn[disabled]{opacity:.28;cursor:not-allowed;transform:none}
  .rbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- alt panel ---------- */
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px)}
  .bar .t{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .bar .sep{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--txt);
    letter-spacing:.05em;transition:.15s;user-select:none;
  }
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip b{color:var(--acc);font-weight:600}
  kbd{font:600 11px/1 ui-monospace,monospace;padding:4px 6px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim)}

  /* ---------- yükleme ---------- */
  .loader{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.96);backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;padding:26px;transition:opacity .5s}
  .loader.gone{opacity:0;pointer-events:none}
  .lbox{width:min(520px,100%)}
  .ltitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .lpct{font:200 68px/1.05 ui-sans-serif,system-ui;margin:10px 0 4px;letter-spacing:-.03em}
  .lstate{font-size:13px;color:var(--dim);min-height:20px}
  .ltrack{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin:20px 0 18px}
  .ltrack > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8ad6ff);transition:width .18s}
  .files{display:grid;gap:7px}
  .f{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .f .nm{width:72px;letter-spacing:.05em}
  .f .tr{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
  .f .tr > i{display:block;height:100%;width:0;background:rgba(255,255,255,.45);transition:width .15s}
  .f.ok{color:var(--acc)}
  .f.ok .tr > i{background:var(--acc)}
  .f .pc{width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .start{margin-top:22px;width:100%;padding:14px;border-radius:12px;cursor:pointer;
    background:var(--acc);color:#04120f;border:0;font:600 14px/1 inherit;letter-spacing:.1em;
    text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
  .start.show{opacity:1;transform:none;pointer-events:auto}
  .start:hover{filter:brightness(1.08)}
  .dbg{position:absolute;left:18px;top:64px;font:11px/1.6 ui-monospace,monospace;color:rgba(255,255,255,.75);
    background:rgba(0,0,0,.45);padding:8px 10px;border-radius:8px;display:none;white-space:pre}
  .dbg.on{display:block}
  @media (max-width:640px){.rbtn{width:44px;height:44px}.lpct{font-size:52px}}
</style>
</head>
<body>

<div class="app">
  <div class="screen" id="screen">
    <!-- videolar: hepsi önceden yüklenir, 0. karede duraklatılmış bekler -->
    <video id="v1"  muted playsinline preload="auto"></video>
    <video id="v2"  muted playsinline preload="auto"></video>
    <video id="v3"  muted playsinline preload="auto"></video>
    <video id="v4"  muted playsinline preload="auto"></video>
    <video id="v5"  muted playsinline preload="auto"></video>
    <video id="v2r" muted playsinline preload="auto"></video>
    <video id="v4r" muted playsinline preload="auto"></video>

    <div class="hud">
      <div class="top">
        <div>
          <div class="scene-name" id="sceneName">SAHNE 01 · OKYANUS</div>
          <div class="scene-sub" id="sceneSub">kusursuz döngü</div>
        </div>
        <div class="badge" id="badge"><i></i><span id="badgeTxt">LOOP</span></div>
      </div>

      <div class="dbg" id="dbg"></div>

      <div class="chain" id="chain"></div>

      <div class="arrows">
        <button class="rbtn" id="prev" title="Geri (←)">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button class="rbtn" id="next" title="İleri (→)">
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="clipbar" id="clipbar"><i></i></div>
    </div>
  </div>

  <div class="bar">
    <span class="t">Akıllı geçiş motoru</span>
    <span class="chip" id="rateChip">yakalama hızı <b id="rateVal">×3</b></span>
    <span class="chip" id="dbgChip">teknik bilgi</span>
    <span class="sep"></span>
    <span class="t"><kbd>←</kbd> <kbd>→</kbd> gezin · <kbd>D</kbd> teknik bilgi</span>
  </div>
</div>

<div class="loader" id="loader">
  <div class="lbox">
    <div class="ltitle">demo5 · akıllı video player</div>
    <div class="lpct" id="lpct">0%</div>
    <div class="lstate" id="lstate">videolar indiriliyor…</div>
    <div class="ltrack"><i id="lbar"></i></div>
    <div class="files" id="files"></div>
    <button class="start" id="startBtn">Başlat</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const FPS = 30;

  /* Zincir:
     LOOP A  --(v2)-->  LOOP B  --(v4)-->  LOOP C
             <--(v2r)--         <--(v4r)--
     Her klibin "bir sonraki karesi" zincirdeki sonraki klibin 0. karesidir. */
  const LOOPS = [
    { id:'v1', name:'SAHNE 01 · OKYANUS', sub:'kusursuz döngü' },
    { id:'v3', name:'SAHNE 02 · GÜN BATIMI', sub:'kusursuz döngü' },
    { id:'v5', name:'SAHNE 03 · YEŞİM', sub:'kusursuz döngü' }
  ];
  const FWD = ['v2','v4'];    // LOOP i -> LOOP i+1
  const BWD = ['v2r','v4r'];  // LOOP i+1 -> LOOP i

  // Codec secimi: H.264/mp4 evrensel, VP9/webm yedek (H.264 desteklemeyen build'ler icin).
  const probe = document.createElement('video');
  const CAN_H264 = !!probe.canPlayType('video/mp4; codecs="avc1.42E01E"');
  const EXT  = CAN_H264 ? 'mp4' : 'webm';
  const MIME = CAN_H264 ? 'video/mp4' : 'video/webm';
  const IDS = ['v1','v2','v3','v4','v5','v2r','v4r'];
  const FILES = IDS.map(id => [id, `media/${id}.${EXT}`]);

  const $ = s => document.querySelector(s);
  const els = {};
  FILES.forEach(([id]) => els[id] = document.getElementById(id));

  let curLoop = 0;
  let activeId = null;
  let busy = false;
  let catchRate = 3;
  const RATES = [2,3,5];

  /* ================= YÜKLEME ================= */
  const filesBox = $('#files'), rows = {};
  FILES.forEach(([id]) => {
    const el = document.createElement('div');
    el.className = 'f';
    el.innerHTML = `<span class="nm">${id}.${EXT}</span><span class="tr"><i></i></span><span class="pc">0%</span>`;
    filesBox.appendChild(el);
    rows[id] = { el, bar: el.querySelector('i'), pc: el.querySelector('.pc') };
  });

  const dl = {}, prime = {};
  FILES.forEach(([id]) => { dl[id] = 0; prime[id] = 0; });

  function paintProgress(){
    let d = 0, p = 0;
    FILES.forEach(([id]) => {
      d += dl[id]; p += prime[id];
      const v = Math.round(dl[id]*100);
      rows[id].bar.style.width = v + '%';
      rows[id].pc.textContent = v + '%';
      rows[id].el.classList.toggle('ok', prime[id] === 1);
      if (prime[id] === 1) rows[id].pc.textContent = 'hazır';
    });
    const total = (d/FILES.length)*0.82 + (p/FILES.length)*0.18;
    const pct = Math.round(total*100);
    $('#lpct').textContent = pct + '%';
    $('#lbar').style.width = pct + '%';
  }

  async function download(id, url){
    const res = await fetch(url, { cache:'force-cache' });
    if (!res.ok) throw new Error(url + ' → ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    if (!res.body || !total){                       // stream yoksa düz indir
      const b = await res.blob(); dl[id] = 1; paintProgress(); return b;
    }
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for(;;){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      dl[id] = Math.min(got/total, 1); paintProgress();
    }
    dl[id] = 1; paintProgress();
    return new Blob(chunks, { type: MIME });
  }

  /* Video gerçekten oynatmaya hazır mı: tüm bayt tamponda + 0. kare boyanmış. */
  function attach(id, blob){
    const v = els[id];
    v.src = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      let settled = false;
      const done = () => { if (settled) return; settled = true; prime[id] = 1; paintProgress(); resolve(); };
      const ready = () => {
        // ilk kareyi zorla boyat → gizli element bile 0. kareyi hazır tutar
        if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => done());
        v.addEventListener('seeked', () => setTimeout(done, 20), { once:true });
        try { v.currentTime = 0.0001; } catch(e){ done(); }
        setTimeout(done, 4000);
      };
      v.addEventListener('error', () => {
        if (settled) return;
        settled = true;
        const c = v.error ? v.error.code : '?';
        reject(new Error(`${id}.${EXT} çözülemedi (kod ${c})`));
      }, { once:true });
      if (v.readyState >= 4) ready();
      else {
        v.addEventListener('canplaythrough', ready, { once:true });
        v.addEventListener('loadeddata', () => { if (!settled) setTimeout(ready, 400); }, { once:true });
        setTimeout(() => { if (!settled) ready(); }, 15000);   // asla sonsuza kilitlenme
      }
      v.load();
    });
  }

  async function boot(){
    try{
      await Promise.all(FILES.map(async ([id,url]) => attach(id, await download(id,url))));
    }catch(err){
      $('#lstate').textContent = 'yükleme hatası: ' + err.message;
      return;
    }
    // güvenlik: tüm klipler tam tamponlanmış mı
    const allBuffered = FILES.every(([id]) => {
      const v = els[id];
      return v.duration > 0 && v.buffered.length > 0 &&
             v.buffered.end(v.buffered.length-1) >= v.duration - 0.05;
    });
    $('#lstate').textContent = allBuffered
      ? 'tüm klipler bellekte · geçişler kare hassasiyetinde hazır'
      : 'klipler hazır';
    buildChain();
    $('#startBtn').classList.add('show');
    // otomatik başlatmayı dene (sessiz video → izinli), olmazsa buton bekler
    start().catch(()=>{});
  }

  $('#startBtn').addEventListener('click', () => start().catch(()=>{}));

  let started = false;
  async function start(){
    if (started) return;
    const v = els[LOOPS[0].id];
    v.loop = true; v.playbackRate = 1; v.currentTime = 0;
    show(v);
    await v.play();
    started = true; activeId = LOOPS[0].id;
    $('#loader').classList.add('gone');
    setBadge('loop');
    tick();
  }

  /* ================= MOTOR ================= */
  function show(el){
    for (const id in els) els[id].classList.toggle('on', els[id] === el);
  }

  // Bir sonraki klip 0. karesinde duraklatılmış ve boyanmış durumda beklediği için
  // katman değişimi tek karede olur → görüntüde sıçrama yok.
  // Hiz rampasi: yakalama hizindan 1x'e yumusak inis (goruntude ani fren olmaz).
  let ramp = 0;
  function rampRate(v, from, to, ms){
    cancelAnimationFrame(ramp);
    const t0 = performance.now();
    v.playbackRate = from;
    const step = () => {
      const k = Math.min((performance.now() - t0) / ms, 1);
      const e = 1 - Math.pow(1 - k, 3);
      v.playbackRate = from + (to - from) * e;
      if (k < 1) ramp = requestAnimationFrame(step);
    };
    ramp = requestAnimationFrame(step);
  }

  function swapTo(id, { rate = 1, loop = false } = {}){
    const prevId = activeId;
    const next = els[id];
    next.loop = loop;
    next.playbackRate = rate;
    show(next);
    activeId = id;
    const p = next.play();
    if (p && p.catch) p.catch(()=>{});
    if (prevId && prevId !== id){
      const prev = els[prevId];
      requestAnimationFrame(() => requestAnimationFrame(() => {
        prev.pause(); prev.loop = false; prev.playbackRate = 1;
        try { prev.currentTime = 0.0001; } catch(e){}
      }));
    }
  }

  // Klibin son karesine varmadan ~1 ekran karesi önce haber verir (donma olmaz).
  let watcher = null;
  function cancelWatch(){ if (watcher){ watcher(); watcher = null; } }
  function onClipEnd(v, cb){
    cancelWatch();
    let fired = false, raf = 0;
    const fire = () => { if (fired) return; fired = true; cancelWatch(); cb(); };
    const ended = () => fire();
    v.addEventListener('ended', ended);
    const tickEnd = () => {
      const d = v.duration || 0;
      const lead = Math.max(v.playbackRate, 1) / 60 * 1.15;   // 1 ekran karesi payı
      if (d && d - v.currentTime <= lead) return fire();
      raf = requestAnimationFrame(tickEnd);
    };
    raf = requestAnimationFrame(tickEnd);
    watcher = () => { v.removeEventListener('ended', ended); cancelAnimationFrame(raf); };
  }

  function go(dir){
    if (!started) return;
    const target = curLoop + dir;
    if (busy || target < 0 || target >= LOOPS.length){
      const b = dir > 0 ? $('#next') : $('#prev');
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return;
    }
    busy = true;
    const loopEl = els[LOOPS[curLoop].id];
    const transId = dir > 0 ? FWD[curLoop] : BWD[curLoop-1];

    // 1) Döngü videosunun kalanını hızlandırarak son kareye yetiş.
    loopEl.loop = false;
    loopEl.playbackRate = catchRate;
    setBadge('fast');
    setChain(curLoop, dir);

    onClipEnd(loopEl, () => {
      // 2) Geçiş klibi tam olarak o karenin devamından başlar; hız 1×'e yumuşak iner.
      swapTo(transId, { rate:catchRate, loop:false });
      rampRate(els[transId], catchRate, 1, 420);
      setBadge('trans');
      onClipEnd(els[transId], () => {
        // 3) Hedef döngüye kilitlen.
        curLoop = target;
        swapTo(LOOPS[curLoop].id, { rate:1, loop:true });
        setBadge('loop');
        setChain(curLoop, 0);
        busy = false;
        syncUI();
      });
    });
  }

  /* ================= ARAYÜZ ================= */
  function buildChain(){
    const c = $('#chain'); c.innerHTML = '';
    LOOPS.forEach((_, i) => {
      const n = document.createElement('div'); n.className = 'node'; n.dataset.k = 'L'+i; c.appendChild(n);
      if (i < LOOPS.length-1){
        const t = document.createElement('div'); t.className = 'node trans'; t.dataset.k = 'T'+i; c.appendChild(t);
      }
    });
    setChain(0,0);
  }
  function setChain(i, dir){
    document.querySelectorAll('.node').forEach(n => n.classList.remove('on'));
    const key = dir === 0 ? 'L'+i : 'T'+(dir > 0 ? i : i-1);
    const el = document.querySelector(`.node[data-k="${key}"]`);
    if (el) el.classList.add('on');
  }
  function setBadge(mode){
    const b = $('#badge'), t = $('#badgeTxt');
    b.className = 'badge' + (mode === 'loop' ? '' : ' ' + mode);
    t.textContent = mode === 'loop' ? 'LOOP'
                  : mode === 'fast' ? '×' + catchRate + ' SON KAREYE YETİŞİYOR'
                  : 'GEÇİŞ KLİBİ';
    $('#clipbar').classList.toggle('trans', mode !== 'loop');
    const s = LOOPS[curLoop];
    $('#sceneName').textContent = s.name;
    $('#sceneSub').textContent = mode === 'loop' ? s.sub
                    : mode === 'fast' ? 'kalan süre ×' + catchRate + ' hızda tamamlanıyor'
                    : 'ara klip oynuyor · sahneler bağlanıyor';
  }
  function syncUI(){
    $('#prev').disabled = curLoop === 0;
    $('#next').disabled = curLoop === LOOPS.length-1;
  }

  function tick(){
    const v = els[activeId];
    if (v && v.duration){
      $('#clipbar').firstElementChild.style.width = (v.currentTime / v.duration * 100) + '%';
      if ($('#dbg').classList.contains('on')){
        $('#dbg').textContent =
          `klip     : ${activeId}\n` +
          `kare     : ${Math.floor(v.currentTime*FPS)} / ${Math.round(v.duration*FPS)}\n` +
          `hız      : ×${v.playbackRate.toFixed(2)}\n` +
          `loop     : ${v.loop}\n` +
          `durum    : ${busy ? 'geçiş zinciri' : 'döngü'}\n` +
          `tampon   : ${v.buffered.length ? Math.round(v.buffered.end(0)/v.duration*100) : 0}%`;
      }
    }
    requestAnimationFrame(tick);
  }

  $('#next').addEventListener('click', () => go(1));
  $('#prev').addEventListener('click', () => go(-1));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key.toLowerCase() === 'd') $('#dbg').classList.toggle('on');
  });
  $('#dbgChip').addEventListener('click', () => $('#dbg').classList.toggle('on'));
  $('#rateChip').addEventListener('click', () => {
    catchRate = RATES[(RATES.indexOf(catchRate)+1) % RATES.length];
    $('#rateVal').textContent = '×' + catchRate;
  });

  syncUI();
  boot();
})();
</script>
</body>
</html>
